[tox]
minversion = 3.2.0
envlist = json,yaml,py,md,gitlint
skipsdist = true
requires = pip >= 8

[testenv]
basepython = python3.11
allowlist_externals =
  git
  bash
  /bin/bash
  sh
  /bin/sh
  xargs
skip_install = True

[testenv:json]
deps =
commands_pre =
    /bin/sh -c "git --no-pager diff HEAD^ HEAD --name-only --diff-filter=d '*.json' > /tmp/.changed_json"
commands =
    /bin/bash -c "cat /tmp/.changed_json | xargs -r -n1 python -m json.tool > /dev/null"

[testenv:yaml]
deps =
    yamllint==1.38.0
commands_pre =
    /bin/sh -c "git --no-pager diff HEAD^ HEAD --name-only --diff-filter=d '*.yaml' '*.yml' > /tmp/.changed_yaml"
commands =
    /bin/bash -c "cat /tmp/.changed_yaml | xargs -r yamllint -c .yamllint"

[testenv:py]
deps =
    pylint==4.1.3
commands_pre =
    /bin/sh -c "git --no-pager diff HEAD^ HEAD --name-only --diff-filter=d '*.py' > /tmp/.changed_py"
commands =
    /bin/bash -c "cat /tmp/.changed_py | xargs -r pylint --disable=all --enable=bad-indentation,trailing-whitespace,unused-wildcard-import,unused-import,unnecessary-semicolon,undefined-variable,syntax-error,unused-variable,using-constant-test,unused-argument,len-as-condition,trailing-newlines,missing-final-newline,reimported,too-many-function-args,singleton-comparison"

[testenv:md]
deps =
    nodeenv
commands_pre =
    nodeenv -p --node=22.23.4
    npm install --global markdownlint-cli@0.49.1
    /bin/sh -c "git --no-pager diff HEAD^ HEAD --name-only --diff-filter=d '*.md' > /tmp/.changed_md"
commands =
    /bin/bash -c "cat /tmp/.changed_md | xargs -r markdownlint"

[testenv:gitlint]
deps =
  gitlint
commands =
    gitlint
